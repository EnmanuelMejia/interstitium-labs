name: Noah web checks
on:
  pull_request:
    branches: [main]
    paths: ["docs/**", "scripts/**", "package*.json", ".github/workflows/noah-check.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "package*.json", ".github/workflows/noah-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noah-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          NOAH_TEST_BROWSER: chromium
      - name: Keep browser verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noah-browser-verification
          path: |
            test-results/
            deploy-shots/noah-*.png
            deploy-shots/jobs-*.png
          if-no-files-found: ignore
          retention-days: 7
