<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Practice — Interstitium Labs</title>
<link rel="stylesheet" href="/assets/il-ux.css"/>
<style>
  body { margin: 0; background: #070b14; color: #e8eef5; font: 1.05rem/1.5 Georgia, "Iowan Old Style", serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  a { color: #e8eef5; }
  nav a { display: inline-block; margin: 0 1rem 0.5rem 0; }
  h1 { font-weight: 500; letter-spacing: -0.03em; }
  button, textarea { font: inherit; color: inherit; }
  textarea, button.row { width: 100%; box-sizing: border-box; }
  textarea { background: transparent; border: 1px solid rgba(232,238,245,.2); border-radius: 0.75rem; padding: 0.75rem; }
  button { min-height: 44px; background: #e8eef5; color: #070b14; border: 0; border-radius: 0.5rem; padding: 0 1rem; margin-top: 0.75rem; }
  button.row { background: transparent; color: inherit; text-align: left; border-bottom: 1px solid rgba(232,238,245,.12); border-radius: 0; }
  td { padding: 0.5rem 0.75rem 0.5rem 0; vertical-align: top; }
</style>
</head>
<body>
<main>
  <p class="il-kicker">One site</p>
  <h1>The practice wing</h1>
  <p>The Learning OS and the practice are the same product. Learn, paths, prep, and the academy stay on this host. Placement and the bench run on this page. Noah’s frontier turn does not: this host cannot call a model. The disk waits until tomorrow.</p>
  <nav id="rooms"></nav>
  <section>
    <h2>Place</h2>
    <div id="place"></div>
  </section>
  <section>
    <h2>Bench</h2>
    <label for="sql">SELECT on readings</label>
    <textarea id="sql" rows="3" spellcheck="false"></textarea>
    <button id="run" type="button">Run</button>
    <div id="out"></div>
  </section>
  <section>
    <h2 data-i18n="cta.audit">Audit</h2>
    <div id="audit"></div>
  </section>
</main>
<script src="/assets/il-practice-wing.js"></script>
</body>
</html>
