<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic Project Cards — Interstitium Labs</title>
<meta name="description" content="TikTok-style cinematic cards for all Interstitium Labs projects.">
<link rel="stylesheet" href="/assets/il-unified.css">
<style>
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; padding: 2rem; max-width: 1400px; margin: 0 auto; }
.card-item { background: #0a0e14; border: 1px solid #1a2332; border-radius: 12px; overflow: hidden; }
.card-item video { width: 100%; aspect-ratio: 16/9; display: block; background: #050810; }
.card-item .card-info { padding: 1.2rem; }
.card-item h3 { color: #00d4ff; margin: 0 0 0.5rem 0; font-size: 1.3rem; }
.card-item p { color: #8899aa; margin: 0 0 1rem 0; font-size: 0.95rem; }
.card-item .downloads { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.card-item .downloads a { padding: 0.4rem 0.8rem; background: #1a2332; color: #00d4ff; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
.card-item .downloads a:hover { background: #243044; }
.page-header { text-align: center; padding: 3rem 2rem 1rem; max-width: 800px; margin: 0 auto; }
.page-header h1 { color: #00d4ff; font-size: 2.5rem; margin-bottom: 0.5rem; }
.page-header p { color: #8899aa; font-size: 1.1rem; }
</style>
</head>
<body>
<main>
<div class="page-header">
<p><a href="/" style="color:#00d4ff">← Interstitium Labs</a></p>
<h1>Cinematic Project Cards</h1>
<p>TikTok-style cinematic cards for every Interstitium Labs project. Dark cyberpunk aesthetic with hexagonal badges, rotating text rings, and bold typography.</p>
</div>

<div class="cards-grid" id="cards-grid">
<!-- Cards injected by JS -->
</div>

<script>
const PROJECTS = [
  { key: "il-26", hq: "il26", name: "IL-26 · Data Analyst", desc: "Data Analyst Certification & Senior Mastery Bootcamp" },
  { key: "il-28", hq: "il28", name: "IL-28 · DevSecOps", desc: "DevSecOps & Cloud Infrastructure Mastery Bootcamp" },
  { key: "il-29", hq: "il29", name: "IL-29 · ThreatLocker", desc: "ThreatLocker Zero-Trust CBT with AI — Cybersecurity Mastery" },
  { key: "devops-superlab", hq: "superlab", name: "DevOps SuperLab", desc: "Hands-on infrastructure lab experience" },
  { key: "rhel-fabric", hq: "rhel", name: "RHEL AI & Systems Fabric", desc: "Bare-metal RHEL 10 architecture for AI workloads" },
  { key: "bootcamp-catalog", hq: "catalog", name: "Bootcamp Catalog", desc: "68 interactive certification prep bootcamps" },
  { key: "tl-interview", hq: "tl-interview", name: "ThreatLocker Interview Prep", desc: "Interview preparation bootcamp" },
  { key: "tl-assessment", hq: "tl-assessment", name: "ThreatLocker Assessment Prep", desc: "Assessment preparation CBT" },
  { key: "ai-vision", hq: "ai-vision", name: "AI Vision Deck", desc: "End-to-end AI automation architecture" },
  { key: "lps-enrollment", hq: "lps", name: "LPS Enrollment Analysis", desc: "Lawrence Public Schools enrollment data case study" },
];

const grid = document.getElementById('cards-grid');
PROJECTS.forEach(p => {
  const div = document.createElement('div');
  div.className = 'card-item';
  div.innerHTML = `
    <video controls preload="metadata" poster="/assets/cards/hq/hq-${p.hq}_poster.png">
      <source src="/assets/cards/hq/hq-${p.hq}_9x16.mp4" type="video/mp4">
    </video>
    <div class="card-info">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="downloads">
        <a href="/assets/cards/${p.key}_16x9.mp4" download>16:9 Video</a>
        <a href="/assets/cards/hq/hq-${p.hq}_9x16.mp4" download>9:16 TikTok (HQ)</a>
        <a href="/assets/cards/hq/hq-${p.hq}_linkedin.png" download>LinkedIn PNG</a>
      </div>
    </div>
  `;
  grid.appendChild(div);
});
</script>

<p style="text-align:center; padding: 2rem; color: #8899aa;">
<a href="https://enmanueldmejia.com/" style="color:#00d4ff">← Back to portfolio</a>
</p>
</main>
</body>
</html>
