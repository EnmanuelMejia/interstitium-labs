name: mobile-android-debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "scripts/sync-mobile-web.sh"
      - ".github/workflows/mobile-android-debug.yml"

jobs:
  android-debug-scaffold:
    name: Sync www + document Android path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci
      - name: Sync docs → www
        run: bash scripts/sync-mobile-web.sh
      - name: Note
        run: |
          echo "Full Android APK requires Android SDK + signed keystore (operator-held)."
          echo "Security overlays: apps/mobile/android-security/"
          echo "See docs/ops/STORE-PUBLISH.md and ENTERPRISE-SECURITY.md"
