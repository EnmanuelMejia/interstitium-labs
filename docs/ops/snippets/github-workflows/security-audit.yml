name: security-audit

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
  workflow_dispatch:

jobs:
  npm-audit-mobile:
    name: npm audit (apps/mobile) fail-on-high
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Audit — fail on high or critical (no --force)
        run: npm audit --omit=dev --audit-level=high
