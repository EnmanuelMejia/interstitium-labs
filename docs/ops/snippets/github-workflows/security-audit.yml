name: security-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secret-patterns:
    name: security-check.sh (secret & tracker patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security-check
        run: bash scripts/security-check.sh

  npm-audit-mobile:
    name: npm audit (apps/mobile) fail-on-high
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Audit — fail on high or critical (no --force)
        run: npm audit --omit=dev --audit-level=high
