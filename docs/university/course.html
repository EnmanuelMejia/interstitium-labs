<!DOCTYPE html>
<html lang="en">
<head><script src="/assets/il-theme.js"></script>
<!-- 2026-10-07: per-course Open Graph / Twitter Card tags are injected at the
     edge by the worker (serveCourseWithOg) for ?course= URLs, because social
     crawlers don't execute the client-side course loader. See docs/_worker.js. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<meta name="color-scheme" content="dark">
<meta name="description" content="Interstitium Labs course shell — SCIENTIA OMNIA VINCIT">
<title>Course · Interstitium Labs</title>
<link rel="stylesheet" href="course-shell.css">
<link rel="stylesheet" href="css/il-progress.css">
</head>
<body data-course="">
<a class="skip-link" href="#shell-main">Skip to course content</a>

<header class="shell-header">
  <img class="sigil" src="../assets/chrome/sigil-decor.webp" alt="Interstitium Labs sigil">
  <div class="lockup">
    <div class="wordmark">Interstitium Labs</div>
    <div class="motto">SCIENTIA OMNIA VINCIT</div>
  </div>
  <div class="spacer"></div>
  <span class="sync-note" id="sync-note"></span>
  <span class="course-code" id="hdr-code"></span>
</header>

<div class="shell-wrap">
  <nav class="shell-nav" id="shell-nav" aria-label="Course sections"></nav>
  <main class="shell-main" id="shell-main" tabindex="-1">
    <noscript><div class="card"><h2>JavaScript required</h2>
    <p class="muted">The course shell renders from a course JSON document and needs JavaScript.</p></div></noscript>
    <div id="shell-error" class="small" style="color:var(--red)" role="alert"></div>
  </main>
</div>

<style>/* canonical footer (page does not load il-unified.css) */
/* ================================================================
 * §21 — Canonical site footer (2026-10-08).
 * Centered layout; gold brand; crisp rendering (no blur,
 * filter, or backdrop-filter anywhere in these rules).
 * ================================================================ */
.il-footer-canonical {
  border-top: 1px solid var(--hairline, rgba(201, 162, 39, 0.22));
  padding: 3rem 1.25rem 4.5rem;
  text-align: center;
}
.il-fc-inner {
  max-width: 60rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.9rem;
}
.il-fc-logo { width: 56px; height: 56px; }
.il-fc-brand {
  color: var(--gold, #c9a227);
  font-weight: 700;
  letter-spacing: 0.32em;
  text-indent: 0.32em;
  font-size: 0.95rem;
}
.il-fc-tagline {
  color: var(--muted, #8b93a5);
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  font-size: 0.72rem;
}
.il-fc-created {
  color: var(--muted, #8b93a5);
  letter-spacing: 0.22em;
  text-indent: 0.22em;
  font-size: 0.66rem;
}
.il-fc-course {
  color: var(--muted, #8b93a5);
  letter-spacing: 0.18em;
  text-indent: 0.18em;
  font-size: 0.66rem;
}
.il-fc-nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.4rem 1.4rem;
  margin-top: 0.6rem;
}
.il-fc-nav a {
  color: var(--muted, #8b93a5);
  text-decoration: none;
  letter-spacing: 0.22em;
  text-indent: 0.22em;
  font-size: 0.72rem;
  padding: 0.25rem 0;
}
.il-fc-nav a:hover { color: var(--gold, #c9a227); }
.il-fc-lang {
  position: fixed;
  left: 1rem;
  bottom: 1rem;
  z-index: 60;
  background: transparent;
  border: 1px solid var(--hairline, rgba(201, 162, 39, 0.22));
  color: var(--muted, #8b93a5);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  padding: 0.45rem 0.8rem;
  border-radius: 999px;
  cursor: pointer;
}
.il-fc-lang:hover { color: var(--gold, #c9a227); border-color: var(--gold, #c9a227); }
</style>
<footer class="il-footer-canonical">
  <div class="il-fc-inner">
    <img src="/assets/chrome/sigil-glyph.svg" alt="Interstitium Labs" class="il-fc-logo" width="56" height="56"/>
    <div class="il-fc-brand">INTERSTITIUMLABS.DEV</div>
    <div class="il-fc-tagline">SCIENTIA OMNIA VINCIT</div>
    <div class="il-fc-created">CREATED BY INTERSTITIUM LABS</div>
    <div class="il-fc-course" id="ft-course"></div>
    <nav class="il-fc-nav" aria-label="Footer">
      <a href="/about/">ABOUT</a>
      <a href="/founders/">FOUNDERS</a>
      <a href="/learn/">LEARN</a>
      <a href="/university/">UNIVERSITY</a>
      <a href="/prep/">PREP</a>
    </nav>
    <nav class="il-fc-nav" aria-label="Footer secondary">
      <a href="/paths/">PATHS</a>
      <a href="/labs/">LABS</a>
      <a href="/noah/">Noah</a>
      <a href="/adapt/">ADAPT</a>
      <a href="/enroll/">ENROLL</a>
      <a href="/play/">PLAY</a>
    </nav>
  </div>
  <button class="il-fc-lang" aria-label="Language">🌐 EN</button>
</footer>

<nav class="mobile-nav" id="mobile-nav" aria-label="Course sections"><div class="row"></div></nav>

<!-- Course data (Phase 2): either fill this block with the course JSON document,
     or load via ?data=<path> / ?course=<id>. Empty = shell shows a loader error. -->
<script type="application/json" id="il-course-data"></script>

<script src="js/noah.js"></script>
<script src="js/il-progress.js"></script>
<script src="course-shell.js"></script>
<script>
  try { document.getElementById('ft-year').textContent = new Date().getFullYear(); } catch (e) {}
</script>
</body>
</html>
