<script>
(function () {
  'use strict';
  /* Academies with an interactive 6-tab course shell (Phase 2 unification). */
  var COURSE_SLUGS = {
    'IL-01': 'il-01-esoteric-foundations',
    'IL-02': 'il-02-mathematical-maturity-engine',
    'IL-03': 'il-03-programming-language-forge',
    'IL-04': 'il-04-systems-linux-windows-networks',
    'IL-05': 'il-05-cloud-devsecops-platform-sre',
    'IL-06': 'il-06-cybersecurity-secure-engineering',
    'IL-07': 'il-07-data-engineering-analytics-ai',
    'IL-08': 'il-08-algorithms-compilers-distributed-formal',
    'IL-09': 'il-09-adaptive-certification-command',
    'IL-10': 'il-10-portfolio-career-professional-practice',
    'IL-11': 'il-11-zero-trust-endpoint-defense',
    'IL-12': 'il-12-ai-engineering',
    'IL-13': 'il-13-software-engineering-interview-prep',
    'IL-14': 'il-14-sre-devops-cloud-security-interview-prep',
    'IL-15': 'il-15-data-engineering-analytics-interview-prep',
    'IL-16': 'il-16-machine-learning-ai-engineering',
    'IL-17': 'il-17-agentic-ai-engineering',
    'IL-18': 'il-18-technical-leadership-interview-prep',
    'IL-19': 'il-19-multicloud-devops-ai-bootcamp',
    'IL-20': 'il-20-mathematics',
    'IL-21': 'il-21-humanities',
    'IL-22': 'il-22-esoteric-secret-knowledge',
    'IL-23': 'il-23-frontier-knowledge',
    'IL-24': 'il-24-threatlocker-assessment-prep-cbt',
    'IL-25': 'il-25-cybersecurity-professional-certificate',
    'IL-26': 'il-26-data-analyst-certification-senior-mastery',
    'IL-27': 'il-27-it-infrastructure-specialist-threatlocker-mastery',
    'IL-28': 'il-28-devsecops-cloud-infrastructure-mastery',
    'IL-29': 'il-29-threatlocker-ai-cybersecurity-mastery'
  };
  function render() {
    var code = IL.qs('id');
    var wrap = document.getElementById('acad-wrap');
    var a = code && IL.academyByCode(code);
    if (!a) {
      document.title = 'Academy not found — Interstitium Labs';
      wrap.innerHTML = '<div class="empty-state"><h3>Academy not found</h3>' +
        '<p>No academy matches <span style="font-family:var(--mono)">' + IL.esc(code || '(none)') + '</span>. ' +
        'The standing index is IL-01 through IL-23 — <a href="index.html#academies">browse the academies</a>.</p></div>';
      return;
    }
    document.title = a.code + ' · ' + a.name + ' — Interstitium Labs';
    document.getElementById('acad-code-crumb').textContent = a.code;
    document.getElementById('acad-h').textContent = a.code + ' · ' + a.name;
    document.getElementById('acad-blurb').textContent = a.blurb || a.tagline || '';
    var FREE_COURSE_CODES = { 'IL-27': 1, 'IL-28': 1, 'IL-29': 1 };
    var cta = document.getElementById('acad-course-cta');
    if (cta) {
      var cslug = COURSE_SLUGS[a.code];
      if (!cslug) {
        cta.innerHTML = '';
      } else {
        /* Paywall badge (2026-10-08): FREE for IL-27/28/29, lock badge for paid courses. */
        var badge = FREE_COURSE_CODES[a.code]
          ? '<span class="il-badge il-badge-free">FREE · open access</span>'
          : '<span class="il-badge il-badge-paid"><svg class="il-lock-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Paid course · unlocks at checkout</span>';
        cta.innerHTML = badge +
          '<div style="margin-top:.7rem"><a class="btn" href="course.html?course=' + IL.esc(cslug) + '">' +
          'Launch the interactive course — 6-tab shell, Noah AI tutor</a></div>';
      }
    }
    document.getElementById('acad-hours').textContent = IL.fmtHours(a.hours);
    var paths = IL.pathsForAcademy(a.code);
    document.getElementById('acad-npaths').textContent = String(paths.length);

    var box = document.getElementById('acad-paths');
    box.innerHTML = '';
    if (!paths.length) {
      box.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><h3>Paths incoming</h3>' +
        '<p>Paths for ' + IL.esc(a.code) + ' are still being published — nothing here is placeholder. ' +
        'Meanwhile, the adaptive engine below runs on any topic you name.</p>' +
        '<p><a class="btn btn-ghost" href="learn.html">Open a free sitting</a></p></div>';
    } else {
      paths.forEach(function (p) {
        var c = document.createElement('article');
        c.className = 'card';
        c.innerHTML =
          '<div class="code">' + IL.esc(p.type || '') + '</div>' +
          '<h3><a href="path.html?id=' + IL.esc(p.id) + '">' + IL.esc(p.title) + '</a></h3>' +
          '<p>' + IL.esc(p.subtitle || '') + '</p>' +
          '<div class="meta"><span><b>' + IL.esc(IL.fmtHours(p.hours)) + '</b></span>' +
          '<span>' + IL.esc(p.difficulty || '') + '</span></div>';
        box.appendChild(c);
      });
    }
  }
  IL.renderPage = render;
  IL.onCatalog(render);
})();
</script>
