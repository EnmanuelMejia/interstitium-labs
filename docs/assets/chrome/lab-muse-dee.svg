<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lab Muse — Dee monas avatar">
  <!-- Interstitium original. Concept: John Dee / Monas Hieroglyphica energy.
       Geometric mark only — not a museum portrait, not Meta Muse. Cyan / gold / void. -->
  <defs>
    <radialGradient id="ilDeeVoid" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="ilDeeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c57a"/>
      <stop offset="50%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
    <linearGradient id="ilDeeCyan" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#ilDeeVoid)" stroke="rgba(94,234,212,0.22)" stroke-width="1.25"/>
  <!-- Lunar crescent -->
  <path d="M32 9.5c6.4 0 11.5 4.3 12.9 10.1A11.8 11.8 0 0 0 32 14.2 11.8 11.8 0 0 0 19.1 19.6C20.5 13.8 25.6 9.5 32 9.5z"
        fill="url(#ilDeeCyan)" opacity="0.95"/>
  <!-- Solar disk + punctum -->
  <circle cx="32" cy="27.5" r="7.8" fill="none" stroke="url(#ilDeeGold)" stroke-width="1.8"/>
  <circle cx="32" cy="27.5" r="2.15" fill="url(#ilDeeGold)"/>
  <!-- Cross / ternary stem -->
  <path d="M32 35.2v13M25.8 42.5h12.4" fill="none" stroke="url(#ilDeeCyan)" stroke-width="1.9" stroke-linecap="round"/>
  <!-- Aries / fire horns — geometric base -->
  <path d="M21.5 52.5c3.4-4.4 7-6.1 10.5-6.1s7.1 1.7 10.5 6.1"
        fill="none" stroke="url(#ilDeeGold)" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M24.2 50.4c1.2-1.7 2.5-2.6 3.9-2.6M39.8 50.4c-1.2-1.7-2.5-2.6-3.9-2.6"
        fill="none" stroke="url(#ilDeeCyan)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <!-- Outer orbit ticks -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(212,168,83,0.22)" stroke-width="0.75" stroke-dasharray="1.5 4.5"/>
</svg>
