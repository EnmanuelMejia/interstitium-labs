<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lab Muse — scholar cap silhouette">
  <!-- Geometric scholarly hood/cap silhouette — gold line on void, cyan glow.
       Abstract Elizabethan scholar cue; not a photographic likeness. -->
  <defs>
    <radialGradient id="ilCapVoid" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="ilCapGold" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e8c57a"/>
      <stop offset="100%" stop-color="#d4a853"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#ilCapVoid)" stroke="rgba(94,234,212,0.22)" stroke-width="1.25"/>
  <!-- Cap crown -->
  <path d="M18 28c0-8 6.2-14.5 14-14.5S46 20 46 28"
        fill="none" stroke="url(#ilCapGold)" stroke-width="1.85" stroke-linecap="round"/>
  <!-- Brim -->
  <path d="M14 30.5c4.5 2.2 10.5 3.5 18 3.5s13.5-1.3 18-3.5"
        fill="none" stroke="url(#ilCapGold)" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Hood drape -->
  <path d="M20 32c-1.5 6 0.5 14 4 18M44 32c1.5 6-0.5 14-4 18"
        fill="none" stroke="#5eead4" stroke-width="1.45" stroke-linecap="round" opacity="0.9"/>
  <!-- Collar / neckline suggestion -->
  <path d="M24 50c2.8-3.5 5.8-5 8-5s5.2 1.5 8 5"
        fill="none" stroke="url(#ilCapGold)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Accent punctum -->
  <circle cx="32" cy="24" r="1.8" fill="#5eead4"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(212,168,83,0.18)" stroke-width="0.7" stroke-dasharray="2 5"/>
</svg>
