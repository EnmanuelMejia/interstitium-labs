<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080c">
  <meta name="description" content="Chat with Noah AI — your personal tutor and assistant at Interstitium Labs.">
  <title>Noah AI · Interstitium Labs</title>
  <link rel="canonical" href="https://interstitiumlabs.dev/noah/">
  <link rel="icon" href="https://interstitiumlabs.dev/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Noah AI · Interstitium Labs">
  <meta property="og:description" content="Chat with Noah AI — your personal tutor and assistant.">
  <meta property="og:image" content="https://interstitiumlabs.dev/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://interstitiumlabs.dev/og.jpg">
  <link rel="stylesheet" href="https://interstitiumlabs.dev/assets/il-noah-avatar.css">
  <style>
    :root{
      --bg:#06080c; --bg2:#0a0d13; --panel:#0d1119; --panel2:#11161f;
      --hairline:rgba(201,162,39,.18); --hairline2:rgba(255,255,255,.08);
      --gold:#c9a227; --gold-soft:rgba(201,162,39,.14);
      --cyan:#40e0d0; --cyan-soft:rgba(64,224,208,.10);
      --text:#e9edf5; --muted:#8b93a5; --muted2:#5d6577;
      --user-bubble:#1a2230; --radius:14px;
      --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
      --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
    .skip{position:absolute;left:-9999px}
    .skip:focus{left:12px;top:12px;z-index:200;background:var(--gold);color:#000;padding:.6rem 1rem;border-radius:8px}

    .muse-app{display:flex;height:100dvh;width:100%}

    /* ============ SIDEBAR ============ */
    .muse-side{width:300px;flex:0 0 300px;background:var(--bg2);border-right:1px solid var(--hairline2);
      display:flex;flex-direction:column;z-index:40;transition:margin-left .25s ease}
    .muse-side.hidden{margin-left:-300px}
    .side-top{padding:14px 14px 8px;display:flex;align-items:center;gap:10px}
    .side-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex:1;min-width:0}
    .side-brand img{width:32px;height:32px}
    .side-brand span{font-size:.82rem;letter-spacing:.22em;color:var(--gold);font-weight:700;white-space:nowrap}
    .new-chat{margin:6px 14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;
      background:var(--gold-soft);border:1px solid var(--hairline);color:var(--gold);
      border-radius:10px;padding:.65rem;font-size:.86rem;font-weight:600;cursor:pointer;letter-spacing:.04em}
    .new-chat:hover{background:rgba(201,162,39,.22)}
    .thread-search{margin:0 14px 8px;position:relative}
    .thread-search input{width:100%;background:var(--panel);border:1px solid var(--hairline2);border-radius:8px;
      color:var(--text);padding:.5rem .7rem;font-size:.82rem}
    .thread-search input::placeholder{color:var(--muted2)}
    .thread-list{flex:1;overflow-y:auto;padding:2px 8px 12px;display:flex;flex-direction:column;gap:2px}
    .thread-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;
      color:var(--muted);border-radius:8px;padding:.6rem .7rem;font-size:.85rem;cursor:pointer}
    .thread-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
    .thread-item.active{background:rgba(201,162,39,.12);color:var(--text)}
    .thread-item .t-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .thread-item .t-del{opacity:0;border:0;background:transparent;color:var(--muted2);cursor:pointer;font-size:1rem;line-height:1;padding:2px 6px;border-radius:6px}
    .thread-item:hover .t-del{opacity:1}
    .thread-item .t-del:hover{color:#f87171;background:rgba(248,113,113,.12)}
    .side-foot{border-top:1px solid var(--hairline2);padding:10px 14px;font-size:.75rem;color:var(--muted2)}
    .side-foot a{color:var(--muted);text-decoration:none}
    .side-foot a:hover{color:var(--gold)}
    .side-scrim{display:none}

    /* ============ MAIN ============ */
    .muse-main{flex:1;min-width:0;display:flex;flex-direction:column;background:
      radial-gradient(900px 420px at 50% -80px, rgba(201,162,39,.07), transparent 70%),
      radial-gradient(700px 380px at 85% 110%, rgba(64,224,208,.05), transparent 70%), var(--bg)}
    .muse-head{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--hairline2);min-height:66px}
    .icon-btn{background:transparent;border:1px solid var(--hairline2);color:var(--muted);border-radius:9px;
      width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;flex:0 0 auto}
    .icon-btn:hover{color:var(--text);border-color:var(--hairline)}
    .icon-btn.on{color:var(--cyan);border-color:rgba(64,224,208,.5);background:var(--cyan-soft)}
    .avatar-slot{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;
      border:1px solid var(--hairline);background:radial-gradient(circle at 50% 35%, #141a26, #06080c)}
    .avatar-slot canvas{width:100%!important;height:100%!important;display:block}
    .avatar-slot video{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;border-radius:50%}
    .head-id{min-width:0;flex:1}
    .head-id h1{margin:0;font-size:1rem;letter-spacing:.02em}
    .head-id .status{margin:2px 0 0;font-size:.76rem;color:var(--muted)}
    .head-id .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:6px;box-shadow:0 0 8px #34d399}
    .head-id .status.busy .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
    .head-actions{display:flex;gap:8px;align-items:center}

    /* ============ THREAD ============ */
    .thread{flex:1;overflow-y:auto;padding:26px 18px 12px;scroll-behavior:smooth}
    .thread-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
    .msg{display:flex;gap:12px;max-width:100%;animation:msgIn .28s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .msg.user{justify-content:flex-end}
    .msg .bubble{max-width:min(78%,640px);padding:.8rem 1rem;border-radius:var(--radius);line-height:1.55;font-size:.94rem;overflow-wrap:anywhere}
    .msg.user .bubble{background:var(--user-bubble);border:1px solid rgba(255,255,255,.09);border-bottom-right-radius:4px}
    .msg.noah .bubble{background:transparent;border:0;padding:.2rem 0;max-width:100%}
    .msg.noah{--b:0}
    .noah-tag{flex:0 0 auto;width:30px;height:30px;border-radius:50%;margin-top:2px;
      background:radial-gradient(circle at 35% 30%, rgba(201,162,39,.5), rgba(201,162,39,.08));
      border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;
      font-size:.68rem;font-weight:800;color:var(--gold);letter-spacing:.05em}
    .bubble h2,.bubble h3,.bubble h4{margin:.9em 0 .45em;line-height:1.3}
    .bubble h2{font-size:1.18rem}.bubble h3{font-size:1.05rem}.bubble h4{font-size:.98rem}
    .bubble p{margin:.55em 0}
    .bubble ul{margin:.5em 0;padding-left:1.3em}
    .bubble li{margin:.28em 0}
    .bubble code{font-family:var(--mono);font-size:.85em;background:rgba(255,255,255,.07);padding:.12em .4em;border-radius:6px}
    .bubble pre{background:#070a10;border:1px solid var(--hairline2);border-radius:10px;padding:.8rem 1rem;overflow-x:auto;position:relative;margin:.7em 0}
    .bubble pre code{background:transparent;padding:0;font-size:.83rem;line-height:1.5}
    .copy-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.06);border:1px solid var(--hairline2);
      color:var(--muted);border-radius:7px;font-size:.72rem;padding:.25rem .6rem;cursor:pointer}
    .copy-btn:hover{color:var(--text);border-color:var(--hairline)}
    .bubble a{color:var(--cyan)}
    .attach-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(64,224,208,.08);border:1px solid rgba(64,224,208,.3);
      color:var(--cyan);border-radius:8px;padding:.3rem .6rem;font-size:.78rem;margin:.25rem .25rem 0 0}
    .attach-img{max-width:220px;border-radius:10px;border:1px solid var(--hairline2);margin-top:.4rem;display:block}
    .viz-wrap{margin:.8em 0;border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:#05070b}
    .viz-wrap canvas{display:block;width:100%;height:300px}
    .viz-cap{padding:.5rem .9rem;font-size:.76rem;color:var(--muted);border-top:1px solid var(--hairline2)}
    .typing{display:inline-flex;gap:5px;padding:.9rem .2rem}
    .typing i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:tp 1.1s infinite}
    .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
    @keyframes tp{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-4px)}}
    .welcome{max-width:820px;margin:8vh auto 0;text-align:center;padding:0 20px}
    .welcome h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:.4em 0;
      background:linear-gradient(100deg,#f5e7c1,var(--gold) 55%,#8a6d1c);-webkit-background-clip:text;background-clip:text;color:transparent}
    .welcome p{color:var(--muted);line-height:1.6}
    .chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
    .chip{background:var(--panel);border:1px solid var(--hairline2);color:var(--text);border-radius:999px;
      padding:.55rem 1rem;font-size:.84rem;cursor:pointer}
    .chip:hover{border-color:var(--gold);color:var(--gold)}

    /* ============ COMPOSER ============ */
    .composer-zone{padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--hairline2);background:rgba(6,8,12,.85);backdrop-filter:blur(8px)}
    .composer{max-width:820px;margin:0 auto}
    .attach-preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
    .attach-preview .ap-item{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--hairline2);
      border-radius:9px;padding:.4rem .6rem;font-size:.78rem;color:var(--muted)}
    .attach-preview .ap-item button{background:none;border:0;color:var(--muted2);cursor:pointer;font-size:.95rem}
    .attach-preview .ap-item button:hover{color:#f87171}
    .composer-box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--hairline2);
      border-radius:16px;padding:8px 8px 8px 14px;transition:border-color .2s}
    .composer-box:focus-within{border-color:var(--hairline)}
    .composer-box textarea{flex:1;background:transparent;border:0;color:var(--text);font-family:var(--font);font-size:.95rem;
      line-height:1.5;resize:none;max-height:180px;padding:8px 0;outline:none}
    .composer-box textarea::placeholder{color:var(--muted2)}
    .send-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:0;cursor:pointer;
      background:linear-gradient(135deg,#e8c34a,var(--gold));color:#111;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
    .send-btn:disabled{opacity:.35;cursor:default}
    .composer-hint{text-align:center;font-size:.72rem;color:var(--muted2);margin-top:8px}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

    @media (max-width:860px){
      .muse-side{position:fixed;top:0;bottom:0;left:0;box-shadow:0 0 60px rgba(0,0,0,.6)}
      .muse-side.hidden{margin-left:-320px}
      .side-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;border:0}
      .muse-side.hidden + .side-scrim{display:none}
      .msg .bubble{max-width:88%}
      .thread{padding:18px 12px 8px}
      .muse-head{padding:8px 12px}
    }
    @media (prefers-reduced-motion:reduce){
      .msg{animation:none}.typing i{animation:none;opacity:.6}
    }
  </style>
</head>
<body data-il-muse>
  <a class="skip" href="#thread">Skip to conversation</a>
  <div class="muse-app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="muse-side" id="sidebar" aria-label="Chat history">
      <div class="side-top">
        <a class="side-brand" href="https://interstitiumlabs.dev/" aria-label="Interstitium Labs home">
          <img src="https://interstitiumlabs.dev/assets/chrome/sigil-glyph.svg" alt="" width="32" height="32">
          <span>NOAH&nbsp;AI</span>
        </a>
      </div>
      <button class="new-chat" id="newChatBtn" type="button">＋ New chat</button>
      <div class="thread-search"><input id="threadSearch" type="search" placeholder="Search chats…" aria-label="Search chats"></div>
      <nav class="thread-list" id="threadList" aria-label="Past conversations"></nav>
      <div class="side-foot">
        <a href="https://interstitiumlabs.dev/university/">Courses</a> ·
        <a href="https://interstitiumlabs.dev/topics/">Topics</a> ·
        <a href="https://interstitiumlabs.dev/prep/drills/">Practice</a>

    </aside>
    <button class="side-scrim" id="sideScrim" aria-label="Close chat history" tabindex="-1"></button>

    <!-- ============ MAIN ============ -->
    <main class="muse-main">
      <header class="muse-head">
        <button class="icon-btn" id="sideToggle" aria-label="Toggle chat history">☰</button>
        <div class="avatar-slot" id="avatarSlot" aria-hidden="true">
          <video src="https://interstitiumlabs.dev/assets/noah/noah-avatar-animated.mp4" autoplay loop muted playsinline preload="auto" aria-label="Noah animated avatar" title="Noah"></video>
        </div>
        <div class="head-id">
          <h1>Noah AI</h1>
          <p class="status" id="noahStatus"><span class="dot"></span><span id="noahStatusText">Ready</span></p>
          <p class="status" style="color:var(--muted)">AI assistant — answers are AI-generated and can be wrong. Verify important facts. <a href="/privacy/" style="color:inherit;text-decoration:underline">Privacy</a></p>
        </div>
        <div class="head-actions">
          <button class="icon-btn" id="miBtn" aria-label="Start a verbal mock interview" title="Verbal mock interview — Noah or Genesis interviews you out loud">🎙</button>
          <button class="icon-btn" id="voiceOutBtn" aria-label="Toggle voice replies" title="Voice replies">🔊</button>
          <button class="icon-btn" id="vizDemoBtn" aria-label="Show a systems anatomy demo" title="Systems anatomy demo">◈</button>

      </header>

      <div class="thread" id="thread" tabindex="-1">
        <div class="thread-inner" id="threadInner" role="log" aria-label="Conversation" aria-live="off"></div>
      </div>

      <div class="composer-zone">
        <div class="composer">
          <div class="attach-preview" id="attachPreview" hidden></div>
          <div class="composer-box">
            <button class="icon-btn" id="attachBtn" aria-label="Attach a file" title="Attach a file">📎</button>
            <input class="sr" type="file" id="fileInput" multiple
              accept="image/*,.pdf,.txt,.md,.markdown,.json,.csv,.js,.ts,.py,.java,.c,.cpp,.h,.go,.rs,.rb,.php,.sh,.sql,.html,.css,.xml,.yaml,.yml,.toml,.log">
            <button class="icon-btn" id="micBtn" aria-label="Dictate with microphone" title="Dictate">🎙</button>
            <textarea id="composerInput" rows="1" maxlength="4000" placeholder="Ask Noah anything…" aria-label="Message Noah"></textarea>
            <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>➤</button>
          </div>
          <p class="composer-hint">Noah answers from this site's knowledge first. Voice, visuals &amp; docs render inline.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
  (function () {
    'use strict';

    /* ================= Thread store (multi-chat over localStorage) ===== */
    var TKEY = 'il-noah-threads-v1';
    var vizSeq = 0;
    function loadThreads() {
      try {
        var raw = localStorage.getItem(TKEY);
        if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.threads)) return d; }
      } catch (e) {}
      return { threads: [], activeId: null };
    }
    function saveThreads() { try { localStorage.setItem(TKEY, JSON.stringify(store)); } catch (e) {} }
    var store = loadThreads();
    function activeThread() {
      var t = null;
      for (var i = 0; i < store.threads.length; i++) if (store.threads[i].id === store.activeId) t = store.threads[i];
      return t;
    }
    function newThread() {
      var t = { id: 't' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
        title: 'New chat', messages: [], updatedAt: Date.now() };
      store.threads.unshift(t); store.activeId = t.id; saveThreads(); return t;
    }
    function touchThread(t, firstUserText) {
      t.updatedAt = Date.now();
      if (t.title === 'New chat' && firstUserText) {
        t.title = firstUserText.replace(/\s+/g, ' ').slice(0, 42) + (firstUserText.length > 42 ? '…' : '');
      }
      store.threads.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      saveThreads();
    }
    function deleteThread(id) {
      store.threads = store.threads.filter(function (t) { return t.id !== id; });
      if (store.activeId === id) store.activeId = store.threads.length ? store.threads[0].id : null;
      saveThreads();
    }

    /* ================= DOM refs ================= */
    var $ = function (id) { return document.getElementById(id); };
    var sidebar = $('sidebar'), sideScrim = $('sideScrim'), threadList = $('threadList'),
        threadInner = $('threadInner'), thread = $('thread'),
        input = $('composerInput'), sendBtn = $('sendBtn'),
        fileInput = $('fileInput'), attachPreview = $('attachPreview'),
        statusEl = $('noahStatus'), statusText = $('noahStatusText'),
        micBtn = $('micBtn'), voiceOutBtn = $('voiceOutBtn');

    var pendingFiles = []; // {name,size,type,dataUrl?,text?}
    var voiceOut = false;
    var avatarInst = null;

    function setStatus(state, label) {
      statusEl.classList.toggle('busy', state !== 'idle');
      statusText.textContent = label || (state === 'idle' ? 'Ready' : state);
      if (avatarInst && avatarInst.setStatus) {
        try { avatarInst.setStatus(state === 'busy' ? 'thinking' : state); } catch (e) {}
      }
    }

    /* ================= Message rendering ================= */
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function extractVizBlocks(text) {
      var blocks = [];
      var out = String(text).replace(/```(anatomy|flow|topology)\s*\n([\s\S]*?)```/g, function (m, kind, body) {
        vizSeq++;
        var id = 'viz-' + vizSeq;
        blocks.push({ kind: kind, body: body.trim(), id: id });
        return '\n\n[[' + id + ']]\n\n';
      });
      return { text: out, blocks: blocks };
    }
    function hydrateViz(host, blocks) {
      if (!blocks.length || !window.NoahViz) return;
      // find text nodes containing [[viz-N]] and swap for canvas
      var walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null);
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (tn) {
        var m = /\[\[(viz-\d+)\]\]/.exec(tn.nodeValue);
        if (!m) return;
        var blk = null;
        for (var i = 0; i < blocks.length; i++) if (blocks[i].id === m[1]) blk = blocks[i];
        if (!blk) return;
        var wrap = document.createElement('div');
        wrap.className = 'viz-wrap';
        var cv = document.createElement('canvas');
        cv.setAttribute('aria-label', blk.kind + ' visualization');
        wrap.appendChild(cv);
        var cap = document.createElement('div');
        cap.className = 'viz-cap';
        cap.textContent = 'Interactive ' + blk.kind + ' · rendered on-device';
        wrap.appendChild(cap);
        tn.parentNode.replaceChild(wrap, tn);
        try {
          var spec = JSON.parse(blk.body);
          window.NoahViz[blk.kind](cv, spec);
        } catch (e) {
          cap.textContent = 'Visualization spec was not valid JSON — ' + e.message;
        }
      });
    }
    function addCopyButtons(host) {
      var pres = host.querySelectorAll('pre');
      pres.forEach(function (pre) {
        if (pre.querySelector('.copy-btn')) return;
        var b = document.createElement('button');
        b.className = 'copy-btn'; b.type = 'button'; b.textContent = 'Copy';
        b.addEventListener('click', function () {
          var code = pre.querySelector('code');
          var txt = code ? code.textContent : pre.textContent;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(function () { b.textContent = 'Copied ✓'; setTimeout(function () { b.textContent = 'Copy'; }, 1500); });
          }
        });
        pre.appendChild(b);
      });
    }
    function renderAssistantContent(bubble, rawText) {
      var ex = extractVizBlocks(rawText);
      if (window.IL && IL.noahAI && IL.noahAI.renderReply) IL.noahAI.renderReply(bubble, ex.text);
      else bubble.textContent = ex.text;
      // strip leftover placeholders renderReply may have wrapped
      hydrateViz(bubble, ex.blocks);
      addCopyButtons(bubble);
    }
    function userBubbleHTML(msg) {
      var h = '';
      if (msg.attachments && msg.attachments.length) {
        msg.attachments.forEach(function (a) {
          if (a.kind === 'image') h += '<img class="attach-img" src="' + a.dataUrl + '" alt="' + esc(a.name) + '">';
          else h += '<span class="attach-chip">📎 ' + esc(a.name) + '</span>';
        });
      }
      return h;
    }
    function renderMessage(msg, animate) {
      var row = document.createElement('div');
      row.className = 'msg ' + (msg.role === 'user' ? 'user' : 'noah');
      if (msg.role === 'noah') {
        var tag = document.createElement('div');
        tag.className = 'noah-tag'; tag.textContent = 'N'; tag.setAttribute('aria-hidden', 'true');
        row.appendChild(tag);
      }
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (msg.role === 'user') {
        var pre = userBubbleHTML(msg);
        var body = document.createElement('div');
        if (window.IL && IL.noahAI && IL.noahAI.renderReply) IL.noahAI.renderReply(body, msg.content);
        else body.textContent = msg.content;
        if (pre) { var tmp = document.createElement('div'); tmp.innerHTML = pre; bubble.appendChild(tmp); }
        bubble.appendChild(body);
        addCopyButtons(bubble);
      } else {
        renderAssistantContent(bubble, msg.content);
      }
      row.appendChild(bubble);
      threadInner.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return row;
    }
    function renderThreadList(filter) {
      threadList.replaceChildren();
      var q = (filter || '').toLowerCase();
      store.threads.forEach(function (t) {
        if (q && t.title.toLowerCase().indexOf(q) === -1) return;
        var b = document.createElement('button');
        b.className = 'thread-item' + (t.id === store.activeId ? ' active' : '');
        b.type = 'button';
        var sp = document.createElement('span'); sp.className = 't-title'; sp.textContent = t.title;
        var del = document.createElement('span'); del.className = 't-del'; del.textContent = '×'; del.title = 'Delete chat'; del.setAttribute('role', 'button'); del.setAttribute('tabindex', '0');
        del.addEventListener('click', function (ev) { ev.stopPropagation(); deleteThread(t.id); if (!activeThread()) newThread(); renderAll(); });
        del.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); del.click(); } });
        b.appendChild(sp); b.appendChild(del);
        b.addEventListener('click', function () { store.activeId = t.id; saveThreads(); renderAll(); closeSidebarMobile(); });
        threadList.appendChild(b);
      });
      if (!threadList.children.length) {
        var p = document.createElement('p');
        p.style.cssText = 'color:var(--muted2);font-size:.8rem;padding:.6rem .7rem';
        p.textContent = q ? 'No chats match.' : 'No conversations yet.';
        threadList.appendChild(p);
      }
    }
    function renderWelcome() {
      var w = document.createElement('div');
      w.className = 'welcome';
      w.innerHTML = '<h2>Talk with Noah.</h2>' +
        '<p>Your tutor and assistant — grounded in the Interstitium Labs curriculum. ' +
        'Ask about a concept, paste code, attach a file, or request a living visualization.</p>' +
        '<div class="chip-row" id="welcomeChips"></div>';
      threadInner.appendChild(w);
      var chips = [
        'Explain how VPN tunnels work',
        'Quiz me on subnetting',
        'Show a Kerberos anatomy',
        'Help me plan for the ThreatLocker interview'
      ];
      var row = w.querySelector('#welcomeChips');
      chips.forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'chip'; b.type = 'button'; b.textContent = c;
        b.addEventListener('click', function () { input.value = c; autoGrow(); sendCurrent(); });
        row.appendChild(b);
      });
    }
    function renderAll() {
      threadInner.replaceChildren();
      var t = activeThread();
      renderThreadList($('threadSearch').value);
      if (!t || !t.messages.length) { renderWelcome(); return; }
      t.messages.forEach(function (m) { renderMessage(m, false); });
    }

    /* ================= Send flow ================= */
    var sending = false;
    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      sendBtn.disabled = !input.value.trim() && !pendingFiles.length;
    }
    function buildPromptWithFiles(text) {
      if (!pendingFiles.length) return { text: text, attachments: [] };
      var ctx = [], atts = [];
      pendingFiles.forEach(function (f) {
        if (f.kind === 'image') { atts.push(f); return; }
        atts.push({ kind: 'file', name: f.name });
        if (f.text) ctx.push('--- attached file: ' + f.name + ' ---\n' + f.text.slice(0, 12000));
      });
      var full = text + (ctx.length ? '\n\n' + ctx.join('\n\n') : '');
      return { text: full, attachments: atts };
    }
    function sendCurrent() {
      var raw = input.value.trim();
      if ((!raw && !pendingFiles.length) || sending) return;
      if (!window.IL || !IL.noahAI || !IL.noahAI.converse) {
        flashStatus('Engine still loading — one moment…'); return;
      }
      sending = true; sendBtn.disabled = true;
      var t = activeThread() || newThread();
      var pack = buildPromptWithFiles(raw);
      var userMsg = { role: 'user', content: raw || '(file attached)', attachments: pack.attachments, ts: Date.now() };
      t.messages.push(userMsg);
      touchThread(t, raw);
      input.value = ''; pendingFiles = []; renderAttachPreview(); autoGrow();
      renderAll();
      // typing indicator
      var row = document.createElement('div');
      row.className = 'msg noah'; row.id = 'typingRow';
      row.innerHTML = '<div class="noah-tag" aria-hidden="true">N</div><div class="bubble"><span class="typing" aria-label="Noah is thinking"><i></i><i></i><i></i></span></div>';
      threadInner.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      setStatus('busy', 'Thinking…');
      IL.noahAI.converse(pack.text, {}).then(function (out) {
        var tr = $('typingRow'); if (tr) tr.remove();
        var reply = (out && out.reply) ? out.reply : 'I had trouble forming a reply just now. Try rephrasing?';
        if (out && out.discarded) reply = out.notice || reply;
        t.messages.push({ role: 'assistant', content: reply, ts: Date.now() });
        touchThread(t); renderAll(); setStatus('idle', 'Ready');
        if (voiceOut && window.IL && IL.noahVoice) { try { IL.noahVoice.speak(reply.slice(0, 600)); } catch (e) {} }
        if (avatarInst && avatarInst.setStatus) { try { avatarInst.setStatus('speaking'); setTimeout(function(){ try{avatarInst.setStatus('idle');}catch(e){} }, 2500); } catch (e) {} }
      }).catch(function (err) {
        var tr = $('typingRow'); if (tr) tr.remove();
        t.messages.push({ role: 'assistant', content: 'Something went wrong reaching the engine (' + esc(String((err && err.message) || err)).slice(0, 120) + '). Your message is saved — try again.', ts: Date.now() });
        touchThread(t); renderAll(); setStatus('idle', 'Ready');
      }).then(function () { sending = false; autoGrow(); });
    }
    function flashStatus(msg) {
      var prev = statusText.textContent;
      statusText.textContent = msg;
      setTimeout(function () { statusText.textContent = prev; }, 2200);
    }

    /* ================= Attachments ================= */
    var CODE_EXT = { js: 'javascript', ts: 'typescript', py: 'python', java: 'java', c: 'c', cpp: 'cpp', h: 'c', go: 'go', rs: 'rust', rb: 'ruby', php: 'php', sh: 'bash', sql: 'sql', html: 'html', css: 'css', xml: 'xml', yml: 'yaml', yaml: 'yaml', toml: 'toml', json: 'json', md: 'markdown', markdown: 'markdown', log: 'text', txt: 'text', csv: 'csv' };
    function renderAttachPreview() {
      attachPreview.replaceChildren();
      attachPreview.hidden = !pendingFiles.length;
      pendingFiles.forEach(function (f, i) {
        var d = document.createElement('div'); d.className = 'ap-item';
        var s = document.createElement('span'); s.textContent = '📎 ' + f.name;
        var x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + f.name);
        x.addEventListener('click', function () { pendingFiles.splice(i, 1); renderAttachPreview(); autoGrow(); });
        d.appendChild(s); d.appendChild(x); attachPreview.appendChild(d);
      });
    }
    fileInput.addEventListener('change', function () {
      var files = Array.prototype.slice.call(fileInput.files || []);
      files.forEach(function (file) {
        if (file.size > 2 * 1024 * 1024) { flashStatus('Skipped ' + file.name + ' (over 2MB)'); return; }
        var rec = { name: file.name, size: file.size };
        if (/^image\//.test(file.type)) {
          rec.kind = 'image';
          var r = new FileReader();
          r.onload = function () { rec.dataUrl = r.result; pendingFiles.push(rec); renderAttachPreview(); autoGrow(); };
          r.readAsDataURL(file);
        } else {
          rec.kind = 'file';
          var r2 = new FileReader();
          r2.onload = function () { rec.text = String(r2.result || ''); pendingFiles.push(rec); renderAttachPreview(); autoGrow(); };
          r2.readAsText(file);
        }
      });
      fileInput.value = '';
    });

    /* ================= Voice ================= */
    var recog = null, listening = false;
    function toggleMic() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { flashStatus('Voice input not supported in this browser'); return; }
      if (listening && recog) { try { recog.stop(); } catch (e) {} return; }
      recog = new SR(); recog.lang = 'en-US'; recog.interimResults = true;
      recog.onresult = function (ev) {
        var txt = '';
        for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        input.value = txt; autoGrow();
      };
      recog.onend = function () { listening = false; micBtn.classList.remove('on'); setStatus('idle', 'Ready'); };
      recog.onerror = function () { listening = false; micBtn.classList.remove('on'); setStatus('idle', 'Ready'); };
      try { recog.start(); listening = true; micBtn.classList.add('on'); setStatus('listening', 'Listening…'); } catch (e) {}
    }

    /* ================= Avatar =================
       The header slot carries the animated tutor likeness video, so no
       procedural mount is needed here (status calls below stay null-safe).
       Twin tutors: if the learner chose Genesis (il-noah-profile avatar),
       swap the header video + title to Genesis. Default stays Noah. */
    function mountAvatar() { /* header uses the animated tutor video */ }
    window.addEventListener('DOMContentLoaded', function () {
      try {
        var prof = null;
        if (window.ILNoahAvatar && ILNoahAvatar.getProfile) prof = ILNoahAvatar.getProfile();
        if (!prof) { try { prof = JSON.parse(localStorage.getItem('il-noah-profile') || '{}'); } catch (e) {} }
        if (prof && prof.avatar === 'genesis') {
          var vid = document.querySelector('#avatarSlot video');
          if (vid) {
            vid.src = 'https://interstitiumlabs.dev/assets/noah/genesis-avatar-animated.mp4';
            vid.setAttribute('aria-label', 'Genesis animated avatar');
            vid.title = 'Genesis';
          }
          var h1 = document.querySelector('.head-id h1');
          if (h1) h1.textContent = 'Genesis AI';
          document.title = document.title.replace('Noah AI', 'Genesis AI');
        }
      } catch (e) {}
    });

    /* ================= Sidebar (mobile) ================= */
    function closeSidebarMobile() { if (window.innerWidth <= 860) sidebar.classList.add('hidden'); }

    /* ================= Events ================= */
    sendBtn.addEventListener('click', sendCurrent);
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendCurrent(); }
    });
    $('attachBtn').addEventListener('click', function () { fileInput.click(); });
    micBtn.addEventListener('click', toggleMic);
    voiceOutBtn.addEventListener('click', function () {
      voiceOut = !voiceOut;
      voiceOutBtn.classList.toggle('on', voiceOut);
      voiceOutBtn.textContent = voiceOut ? '🔊' : '🔇';
      if (!voiceOut && window.IL && IL.noahVoice) { try { IL.noahVoice.stop(); } catch (e) {} }
      flashStatus(voiceOut ? 'Voice replies on' : 'Voice replies off');
    });
    $('newChatBtn').addEventListener('click', function () { newThread(); renderAll(); closeSidebarMobile(); input.focus(); });
    $('threadSearch').addEventListener('input', function (ev) { renderThreadList(ev.target.value); });
    $('sideToggle').addEventListener('click', function () { sidebar.classList.toggle('hidden'); });
    sideScrim.addEventListener('click', function () { sidebar.classList.add('hidden'); });
    $('vizDemoBtn').addEventListener('click', function () {
      var t = activeThread() || newThread();
      var demo = 'Here is how I visualize systems — every part in motion, together:\n\n```anatomy\n' +
        JSON.stringify({ title: 'Kerberos Authentication', parts: [
          { label: 'Client', kind: 'core' }, { label: 'KDC', kind: 'core' },
          { label: 'TGT', kind: 'part' }, { label: 'Service Ticket', kind: 'part' },
          { label: 'Service', kind: 'core' }
        ], flows: [{ from: 0, to: 1, label: 'AS-REQ' }, { from: 1, to: 0, label: 'TGT' }, { from: 0, to: 4, label: 'AP-REQ' }] }) +
        '\n```\nAsk me about any system and I will render its anatomy like this.';
      t.messages.push({ role: 'assistant', content: demo, ts: Date.now() });
      touchThread(t); renderAll();
    });

    /* ================= Init ================= */
    function init() {
      if (window.innerWidth <= 860) sidebar.classList.add('hidden');
      if (!activeThread()) newThread();
      renderAll();
      mountAvatar();
      autoGrow();
      // wait for engine, then mark ready
      var tries = 0;
      (function waitEngine() {
        if (window.IL && IL.noahAI && IL.noahAI.ready) {
          IL.noahAI.ready().then(function () { setStatus('idle', 'Ready'); }).catch(function () {});
        } else if (++tries < 40) { setTimeout(waitEngine, 250); }
      })();
      // page context for Noah-everywhere
      try { if (window.IL && IL.noahAI && IL.noahAI.setPageContext) IL.noahAI.setPageContext({ title: 'Noah AI chat', path: '/noah/', type: 'chat' }); } catch (e) {}
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>
  <script src="https://interstitiumlabs.dev/assets/il-search.js" defer></script>
  <script src="https://interstitiumlabs.dev/assets/il-translate.js" defer></script>
</body>
</html>
